# 观止东方 · 生产部署（单服务器：Caddy + 前端静态 + Fastify API + PostgreSQL）
#
# 与本地 compose.yaml 的区别：
#   1. 新增 caddy 服务：TLS 自动签发、托管前端静态文件、/api 反代到 Fastify
#   2. 新增 webclient 构建阶段产物挂载
#   3. API 只绑定 127.0.0.1，公网只暴露 80/443
#
# 服务器启动：
#   cp .env.production.example .env   # 填入真实值
#   docker compose -f compose.prod.yaml up --build -d
#
# 前提：先在服务器/CI 上构建前端 dist/client（见 docs/DEPLOY.md）

name: guanzhi-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${CORS_ORIGINS:-https://localhost}   # 用于 Caddyfile 域名，取第一个域名
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist/client:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 不对宿主机暴露端口；DB 仅容器网络内可达
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      UPLOAD_DIR: /app/data/uploads
      IP_HASH_SALT: ${IP_HASH_SALT:?IP_HASH_SALT is required}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_FROM: ${NOTIFICATION_FROM:-}
      NOTIFICATION_TO: ${NOTIFICATION_TO:-}
    command: ["sh", "-c", "node dist/scripts/migrate.js && node dist/scripts/seed.js && node dist/server.js"]
    volumes:
      - backend_uploads:/app/data/uploads
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  backend_uploads:
  caddy_data:
  caddy_config:
